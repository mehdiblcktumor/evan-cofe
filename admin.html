<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>مدیریت منو | EVAN COFFEE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700&family=Playfair+Display:wght@500;600&display=swap');
:root{--bg:#070707;--panel:#111112;--txt:#f5f1e9;--muted:#928d85;--gold:#c7a76a;--gold2:#ecd8a9;--line:rgba(199,167,106,.23)}*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;background:radial-gradient(circle at 50% -10%,#c7a76a22,transparent 35%),var(--bg);color:var(--txt);font-family:Vazirmatn,sans-serif}.wrap{width:min(100%,650px);margin:auto;padding:26px 16px 50px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:25px}.brand{font:500 25px "Playfair Display",serif;letter-spacing:4px;direction:ltr}.sub{margin-top:5px;color:var(--gold);font-size:9px;letter-spacing:2px}.top-actions{display:flex;gap:8px}.btn{border:1px solid var(--line);border-radius:11px;padding:9px 12px;background:#ffffff08;color:var(--txt);font:10px Vazirmatn;cursor:pointer}.btn.gold{background:linear-gradient(135deg,#c7a76a,#98743b);color:#171209;border-color:#d9bb7e;font-weight:700}.categories{display:flex;gap:18px;overflow-x:auto;scrollbar-width:none;margin-bottom:22px;padding:4px 2px 12px;border-bottom:1px solid #ffffff12}.categories::-webkit-scrollbar{display:none}.cat{border:0;background:transparent;color:#77736c;white-space:nowrap;font:500 11px Vazirmatn;cursor:pointer}.cat.active{color:var(--gold2);font-weight:700}.section{display:none}.section.active{display:block}.section-title{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:15px}.section-title span{height:1px;background:linear-gradient(to left,transparent,var(--line));flex:1}.items{display:grid;gap:8px}.item{display:flex;align-items:center;gap:11px;padding:10px;border:1px solid #ffffff0d;border-radius:14px;background:linear-gradient(135deg,#ffffff08,#ffffff02);cursor:pointer;transition:.2s}.item:hover{border-color:#c7a76a55;transform:translateY(-1px)}.thumb{width:58px;height:58px;flex:0 0 58px;border-radius:12px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:25px}.thumb img{width:100%;height:100%;object-fit:contain}.info{min-width:0;flex:1}.name{font-size:13px;font-weight:600;overflow-wrap:anywhere}.price{font-size:11px;color:#dfc487;white-space:pre-line;text-align:left}.hint{text-align:center;color:#6f6a62;font-size:10px;margin:20px 0}.empty{text-align:center;color:var(--muted);padding:35px}
.modal{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:18px;background:#050507c7;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}.modal.open{display:flex}.dialog{position:relative;width:min(100%,430px);max-height:92vh;overflow:auto;padding:25px 20px 20px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,#19191af5,#0e0e0ff5);box-shadow:0 25px 80px #000b,inset 0 0 0 1px #ffffff08}.dialog:before{content:"";position:absolute;inset:8px;border:1px solid #c7a76a18;border-radius:16px;pointer-events:none}.dialog>*{position:relative}.close{position:absolute;top:10px;left:10px;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:#18181a;color:var(--txt);font-size:20px;cursor:pointer}.dialog h2{text-align:center;font-size:18px;margin-bottom:20px}.field{margin-bottom:12px}.field label{display:block;color:#d9c89f;font-size:10px;margin-bottom:6px}.field input,.field select{width:100%;height:43px;padding:0 11px;border:1px solid #ffffff18;border-radius:10px;outline:0;background:#0005;color:var(--txt);font:11px Vazirmatn}.field input:focus,.field select:focus{border-color:#c7a76a88}.preview{height:125px;margin-bottom:14px;border-radius:13px;background:#fff;display:grid;place-items:center;overflow:hidden;font-size:40px}.preview img{width:100%;height:100%;object-fit:contain}.modal-actions{display:flex;gap:8px;margin-top:18px}.modal-actions>*{flex:1}.danger{border-color:#a55d55;color:#e5a198;background:#5b252222}.status{text-align:center;min-height:18px;color:#df9b8f;font-size:10px;margin-top:10px}
</style>
</head>
<body><main class="wrap"><header class="top"><div><div class="brand">EVAN COFFEE</div><div class="sub">PRIVATE MENU MANAGEMENT</div></div><div class="top-actions"><button class="btn gold" id="newBtn">آیتم جدید</button><button class="btn" id="accountBtn">حساب مدیر</button><button class="btn" id="logoutBtn">خروج</button></div></header><nav class="categories" id="categories"></nav><div id="sections"></div><p class="hint">برای ویرایش، روی هر آیتم بزنید.</p></main>
<div class="modal" id="itemModal"><div class="dialog"><button class="close" data-close="itemModal">×</button><h2 id="modalTitle">ویرایش آیتم</h2><form id="itemForm"><input type="hidden" name="id"><div class="preview" id="preview">☕</div><div class="field"><label>تصویر آیتم</label><input name="image" type="file" accept="image/*"></div><div class="field"><label>نام آیتم</label><input name="name" required></div><div class="field"><label>دسته‌بندی</label><input name="category" required></div><div class="field"><label>قیمت</label><input name="price" required placeholder="مثلاً: ۲۰۰ گرم : ۵۰۰ تومان&#10;۱ کیلوگرم : ۲۵۰۰ تومان"></div><div class="field"><label>ایموجی، در صورت نداشتن تصویر</label><input name="emoji" placeholder="☕"></div><div class="modal-actions"><button class="btn gold" type="submit">ذخیره تغییرات</button><button class="btn danger" type="button" id="deleteBtn">حذف آیتم</button></div><div class="status" id="itemStatus"></div></form></div></div>
<div class="modal" id="accountModal"><div class="dialog"><button class="close" data-close="accountModal">×</button><h2>تنظیمات حساب مدیر</h2><form id="accountForm"><div class="field"><label>نام کاربری جدید</label><input name="username" required></div><div class="field"><label>رمز عبور فعلی</label><input name="currentPassword" type="password" required></div><div class="field"><label>رمز عبور جدید</label><input name="newPassword" type="password" required></div><button class="btn gold" style="width:100%">ذخیره اطلاعات ورود</button><div class="status" id="accountStatus"></div></form></div></div>
<script>
const token=localStorage.getItem('evan_admin_token');if(!token)location.href='login.html';
const api=(url,opt={})=>fetch(url,{...opt,headers:{Authorization:'Bearer '+token,...(opt.headers||{})}}).then(async r=>{if(r.status===401){localStorage.removeItem('evan_admin_token');location.href='login.html'}const d=await r.json();if(!r.ok)throw Error(d.error||'خطا');return d});
let items=[],current=null;
const cats=document.getElementById('categories'), sections=document.getElementById('sections');
function priceText(p){return String(p||'').split(/\s+(?=(?:۱|1)\s*کیلوگرم|بسته ای)/).join('\n')}
function render(){const names=[...new Set(items.map(x=>x.category))];cats.innerHTML=names.map((x,i)=>`<button class="cat ${i?'':'active'}" data-cat="${x}">${x}</button>`).join('');sections.innerHTML=names.map((cat,i)=>`<section class="section ${i?'':'active'}" data-cat="${cat}"><div class="section-title"><b>${cat}</b><span></span></div><div class="items">${items.filter(x=>x.category===cat).map(x=>`<article class="item" data-id="${x.id}"><div class="thumb">${x.image_url?`<img src="${x.image_url}" alt="">`:x.emoji||'☕'}</div><div class="info"><div class="name"></div><div class="price"></div></div></article>`).join('')||'<div class="empty">آیتمی در این بخش وجود ندارد.</div>'}</div></section>`).join('');items.forEach(x=>{const e=document.querySelector(`.item[data-id="${x.id}"]`);if(e){e.querySelector('.name').textContent=x.name;e.querySelector('.price').textContent=priceText(x.price)}});cats.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{cats.querySelectorAll('.cat').forEach(x=>x.classList.remove('active'));b.classList.add('active');sections.querySelectorAll('.section').forEach(s=>s.classList.toggle('active',s.dataset.cat===b.dataset.cat))});document.querySelectorAll('.item').forEach(e=>e.onclick=()=>openItem(Number(e.dataset.id)))}
function openItem(id){current=items.find(x=>x.id===id);const f=document.getElementById('itemForm');f.reset();['id','name','category','price','emoji'].forEach(k=>f.elements[k].value=current[k]||'');document.getElementById('preview').innerHTML=current.image_url?`<img src="${current.image_url}">`:(current.emoji||'☕');document.getElementById('modalTitle').textContent='ویرایش آیتم';document.getElementById('deleteBtn').style.display='block';document.getElementById('itemStatus').textContent='';document.getElementById('itemModal').classList.add('open')}
function openNew(){current=null;const f=document.getElementById('itemForm');f.reset();document.getElementById('preview').textContent='☕';document.getElementById('modalTitle').textContent='افزودن آیتم';document.getElementById('deleteBtn').style.display='none';document.getElementById('itemStatus').textContent='';document.getElementById('itemModal').classList.add('open')}
async function load(){items=await api('/api/menu');render()}document.getElementById('newBtn').onclick=openNew;document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('open'));document.getElementById('logoutBtn').onclick=()=>{localStorage.removeItem('evan_admin_token');location.href='login.html'};document.getElementById('accountBtn').onclick=()=>document.getElementById('accountModal').classList.add('open');document.getElementById('itemForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('id');try{await api(id?'/api/items/'+id:'/api/items',{method:id?'PUT':'POST',body:f});document.getElementById('itemModal').classList.remove('open');load()}catch(x){document.getElementById('itemStatus').textContent=x.message}};document.getElementById('deleteBtn').onclick=async()=>{if(!confirm('این آیتم حذف شود؟'))return;await api('/api/items/'+current.id,{method:'DELETE'});document.getElementById('itemModal').classList.remove('open');load()};document.getElementById('accountForm').onsubmit=async e=>{e.preventDefault();const r=await api('/api/account',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});document.getElementById('accountStatus').textContent=r.error||'ذخیره شد؛ دوباره وارد شوید.';if(!r.error)setTimeout(()=>location.href='login.html',700)};load();
</script><script>(function(){function c(){var b=a.contentDocument||(a.contentWindow&&a.contentWindow.document);if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'a396f78409b1dfa5',t:'MTc4OTEzMjc5NQ=='};var a=document.createElement('script');a.src='/cdn-cgi/challenge-platform/scripts/jsd/main.js';document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})();</script></body></html>
