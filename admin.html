<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>پنل مدیریت | EVAN COFFEE</title><style>body{margin:0;background:#070707;color:#f5f1e9;font-family:Vazirmatn,Arial;padding:24px}main{max-width:900px;margin:auto}.panel{padding:24px;border:1px solid #c7a76a55;border-radius:22px;background:#111}input,select,button{padding:11px;margin:5px;border-radius:9px;border:1px solid #c7a76a55;background:#171717;color:#fff}button{background:#c7a76a;color:#17100a;cursor:pointer}.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;border-bottom:1px solid #ffffff18;padding:12px 0}.row img{width:55px;height:55px;object-fit:contain;background:#fff;border-radius:8px}.muted{color:#aaa;font-size:12px}</style></head><body><main><h1>پنل مدیریت EVAN COFFEE</h1><section class="panel"><form id="add"><input name="category" placeholder="دسته‌بندی" required><input name="name" placeholder="نام آیتم" required><input name="price" placeholder="قیمت" required><input name="emoji" placeholder="ایموجی"><input name="image" type="file" accept="image/*"><button>افزودن آیتم</button></form><p class="muted">برای ویرایش، مقدارها را تغییر دهید و ذخیره کنید. تصویر از گالری انتخاب می‌شود.</p><div id="items"></div></section><section class="panel" style="margin-top:18px"><h2>تغییر دسترسی مدیر</h2><form id="account"><input name="username" placeholder="نام کاربری جدید" required><input name="currentPassword" type="password" placeholder="رمز فعلی" required><input name="newPassword" type="password" placeholder="رمز جدید" required><button>ذخیره دسترسی</button></form></section></main><script>
const token=localStorage.getItem('evan_admin_token');if(!token)location.href='login.html';const api=(u,o={})=>fetch(u,{...o,headers:{Authorization:'Bearer '+token,...(o.headers||{})}}).then(async r=>{if(r.status===401){localStorage.removeItem('evan_admin_token');location.href='login.html'}return r.json()});
async function load(){const items=await api('/api/menu');document.querySelector('#items').innerHTML=items.map(x=>`<div class="row"><img src="${x.image_url||''}"><input data-k="category" value="${x.category}"><input data-k="name" value="${x.name}"><input data-k="price" value="${x.price}"><input data-k="emoji" value="${x.emoji||''}"><input data-file type="file" accept="image/*"><button onclick="save(${x.id},this)">ذخیره</button><button onclick="del(${x.id})">حذف</button></div>`).join('')}
async function save(id,b){const row=b.parentElement, f=new FormData();row.querySelectorAll('[data-k]').forEach(x=>f.append(x.dataset.k,x.value));if(row.querySelector('[data-file]').files[0])f.append('image',row.querySelector('[data-file]').files[0]);await api('/api/items/'+id,{method:'PUT',body:f});load()}async function del(id){if(confirm('حذف شود؟')){await api('/api/items/'+id,{method:'DELETE'});load()}}
document.querySelector('#add').onsubmit=async e=>{e.preventDefault();await api('/api/items',{method:'POST',body:new FormData(e.target)});e.target.reset();load()};document.querySelector('#account').onsubmit=async e=>{e.preventDefault();const o=Object.fromEntries(new FormData(e.target));const r=await api('/api/account',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)});alert(r.error||'ذخیره شد؛ دوباره وارد شوید.');if(!r.error)location.href='login.html'};load();
</script><script>(function(){function c(){var b=a.contentDocument||(a.contentWindow&&a.contentWindow.document);if(b){var d=b.createElement('script');d.innerHTML="window.__CF$cv$params={r:'a396c6f07ac1fead',t:'MTc4OTEzMDgwNQ=='};var a=document.createElement('script');a.src='/cdn-cgi/challenge-platform/scripts/jsd/main.js';document.getElementsByTagName('head')[0].appendChild(a);";b.getElementsByTagName('head')[0].appendChild(d)}}if(document.body){var a=document.createElement('iframe');a.height=1;a.width=1;a.style.position='absolute';a.style.top=0;a.style.left=0;a.style.border='none';a.style.visibility='hidden';document.body.appendChild(a);if('loading'!==document.readyState)c();else if(window.addEventListener)document.addEventListener('DOMContentLoaded',c);else{var e=document.onreadystatechange||function(){};document.onreadystatechange=function(b){e(b);'loading'!==document.readyState&&(document.onreadystatechange=e,c())}}}})();</script></body></html>
