<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#070707"><title>QR Code | EVAN COFFEE</title><style>body{margin:0;background:#070707;color:#f5f1e9;font-family:Arial,sans-serif}.wrap{max-width:520px;margin:auto;padding:32px 18px 50px;text-align:center}.logo{font:600 20px Georgia,serif;letter-spacing:5px;color:#c7a76a;margin:15px 0 30px}.card{border:1px solid rgba(255,255,255,.09);background:#101010;border-radius:18px;padding:22px}.title{font:700 25px Arial,sans-serif;margin-bottom:8px}.muted{color:#89857d;font-size:13px;line-height:1.8;margin-bottom:18px}input{width:100%;box-sizing:border-box;padding:13px;border-radius:12px;border:1px solid rgba(199,167,106,.25);background:#080808;color:#fff;font-size:14px;direction:ltr;text-align:left}button{margin-top:12px;border:0;border-radius:12px;padding:12px 22px;background:#c7a76a;color:#111;font-weight:700;cursor:pointer}#qr{margin:22px auto 8px;background:#fff;padding:14px;width:260px;min-height:260px;box-sizing:border-box;display:grid;place-items:center;border-radius:8px}#qr img{max-width:100%;height:auto}.hint{font-size:11px;color:#89857d;margin-top:14px}</style></head><body><div class="wrap"><div class="logo">EVAN COFFEE</div><div class="card"><div class="title">QR CODE</div><div class="muted">این صفحه برای ساخت QR کد میزهای کافه است. آدرس عمومی سایت را وارد کنید و سپس QR را چاپ کنید.</div><input id="url" type="url" autocomplete="off"><button onclick="makeQR()">ساخت QR کد</button><div id="qr">آدرس سایت را وارد کنید</div><div class="hint">QR باید به آدرس عمومی صفحه اصلی منو یعنی index سایت شما اشاره کند.</div></div></div><script>const input=document.getElementById('url');input.value=location.origin+location.pathname.replace(/qr\.html$/i,'index.html');function makeQR(){const u=input.value.trim();if(!u)return;const box=document.getElementById('qr');box.innerHTML='<img alt="QR Code" src="https://api.qrserver.com/v1/create-qr-code/?size=500x500&margin=10&data='+encodeURIComponent(u)+'">';}</script></body></html>
